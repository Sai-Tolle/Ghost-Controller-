# Build both AppImage architectures and the Windows installer, and ship them
# together on one release.
#
# x86_64: GitHub's ubuntu-22.04 runner — PyPI has x86_64 wheels for
#          PySide6/numpy/PyAV/OpenCV, so the normal pip venv path works.
#          Deliberately the OLDEST available runner: PyInstaller bundles the
#          build host's libpython, which needs the host's glibc or newer. Built
#          on 24.04 (glibc 2.39) the AppImage died on Ubuntu 22.04 with
#          "GLIBC_2.38 not found"; built on 22.04 (glibc 2.35) it runs on
#          22.04 and everything newer.
# aarch64: ubuntu-24.04-arm runner (free for public repos) + Debian trixie
#          container — Ubuntu 24.04 has no python3-pyside6 package and PyPI
#          has NO aarch64 wheels for those four, but trixie ships them as
#          arm64 debs (python3-pyside6.qtquick 6.8.2.1 verified via the
#          Debian madison API), so packaging/build-linux.sh's aarch64 branch
#          uses apt for the heavy deps and pip only for pure-Python remainder.
#
# windows: windows-2022 runner, PyPI wheels for everything, PyInstaller onedir
#          wrapped in an Inno Setup installer. Before the upload the installer
#          is installed silently, the installed app passes --smoke, and it is
#          uninstalled again, so a release never ships an installer that fails.
#
# The jobs run one after another (x86_64 → ARM64 → Windows) so all attach to
# the SAME release without racing to create it. Trigger: push a tag (v*) or run manually from the
# Actions tab (artifacts only).
name: Release builds (Linux x86_64 + ARM64, Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: the token is read-only by default; only the jobs that
# attach files to a release get contents:write. Third-party actions are pinned
# to full commit SHAs (a moved tag must not be able to ship code in a release).
permissions:
  contents: read

jobs:
  x86_64-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # build-linux.sh reads GH_REPO for the AppImageUpdate feed URL.
      GH_REPO: ${{ github.repository }}
      # Headless Qt for the in-build smoke test.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install system packages (Qt runtime libs, zsync for the feed)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 zsync file

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build AppImage (+ .zsync update feed sidecar)
        run: ./packaging/build-linux.sh --appimage

      - name: Smoke test the built AppImage
        run: ./dist/Ghost_Controller-x86_64.AppImage --smoke

      - name: Checksum (verified by install.sh before the AppImage is made executable)
        run: cd dist && sha256sum Ghost_Controller-x86_64.AppImage > Ghost_Controller-x86_64.AppImage.sha256

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/Ghost_Controller-x86_64.AppImage
            dist/Ghost_Controller-x86_64.AppImage.zsync
            dist/Ghost_Controller-x86_64.AppImage.sha256

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ghost_Controller-x86_64
          path: |
            dist/Ghost_Controller-x86_64.AppImage
            dist/Ghost_Controller-x86_64.AppImage.zsync
            dist/Ghost_Controller-x86_64.AppImage.sha256

  arm64-appimage:
    # Sequential so both jobs attach to one release without a create-race.
    needs: x86_64-appimage
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    container:
      image: debian:trixie
    env:
      GH_REPO: ${{ github.repository }}
      QT_QPA_PLATFORM: offscreen
      # No FUSE inside containers; AppImages self-extract instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install system packages (Qt, QML modules, video libs, build tools)
        run: |
          apt-get update
          # python3-pyside6.qtquick ships the QtQuick bindings but NOT the
          # QML modules the app imports (QtQuick.Controls/Layouts/Dialogs) —
          # Debian splits each QML module into its own qml6-module-* package,
          # so install them explicitly. Without these the headless smoke test
          # aborts with `module "QtQuick.Controls" is not installed`.
          apt-get install -y --no-install-recommends \
            git ca-certificates curl file xz-utils \
            python3 python3-pip python3-venv python3-dev \
            python3-pyside6.qtquick python3-pyside6.qtwidgets \
            python3-numpy python3-av python3-opencv \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates qml6-module-qtquick-shapes \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            libgl1 libegl1 zsync build-essential

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build AppImage (+ .zsync update feed sidecar)
        run: ./packaging/build-linux.sh --appimage

      - name: Smoke test the built AppImage
        run: ./dist/Ghost_Controller-aarch64.AppImage --smoke

      - name: Checksum (verified by install.sh before the AppImage is made executable)
        run: cd dist && sha256sum Ghost_Controller-aarch64.AppImage > Ghost_Controller-aarch64.AppImage.sha256

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/Ghost_Controller-aarch64.AppImage
            dist/Ghost_Controller-aarch64.AppImage.zsync
            dist/Ghost_Controller-aarch64.AppImage.sha256

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ghost_Controller-aarch64
          path: |
            dist/Ghost_Controller-aarch64.AppImage
            dist/Ghost_Controller-aarch64.AppImage.zsync
            dist/Ghost_Controller-aarch64.AppImage.sha256

  windows-installer:
    needs: arm64-appimage
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Inno Setup and ffmpeg (video tests)
        shell: pwsh
        run: choco install innosetup ffmpeg -y --no-progress

      - name: Build bundle + installer
        shell: pwsh
        run: ./packaging/build-windows.ps1 -Installer

      - name: Video and radio system tests on Windows
        shell: pwsh
        run: |
          .venv-desktop\Scripts\python.exe tests\test_radio_systems.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv-desktop\Scripts\python.exe tests\test_video.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install silently, smoke test the installed app, uninstall
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\GhostController"
          $p = Start-Process dist\Ghost_Controller-Setup-x86_64.exe -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          # GUI build: no console, so judge by exit code and the saved frame.
          $p = Start-Process "$dir\ghost-handler.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed app --smoke exit $($p.ExitCode)" }
          if (-not (Get-ChildItem $dir -Recurse -Filter smoke.png)) { throw "no smoke frame" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit $($p.ExitCode)" }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\Ghost_Controller-Setup-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Ghost_Controller-Setup-x86_64.exe" | Out-File -Encoding ascii -NoNewline dist\Ghost_Controller-Setup-x86_64.exe.sha256

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/Ghost_Controller-Setup-x86_64.exe
            dist/Ghost_Controller-Setup-x86_64.exe.sha256

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ghost_Controller-Windows-x86_64
          path: |
            dist/Ghost_Controller-Setup-x86_64.exe
            dist/Ghost_Controller-Setup-x86_64.exe.sha256
